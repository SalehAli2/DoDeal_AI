[project]
name = "dodeal-ai"
version = "0.1.0"
description = "Dodeal AI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt>=2.13.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "redis>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dodeal_ai"]

[tool.pytest.ini_options]
  pythonpath = ["."]
  asyncio_mode = "auto"
  
[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
