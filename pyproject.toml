[project]
name = "dodeal-ai"
version = "0.1.0"
description = "Dodeal AI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt>=2.13.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "redis>=8.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dodeal_ai"]

[tool.pytest.ini_options]
  pythonpath = ["."]
  asyncio_mode = "auto"
  addopts = "--cov=src/dodeal_ai --cov-report=term-missing -m \"not integration\""
  markers = [
    "integration: starts a local ASGI-backed fake HTTP server; excluded from the default run (pytest -m integration to run it).",
  ]

[tool.coverage.report]
fail_under = 92
exclude_also = [
    'class .*\bProtocol\):',
]
[tool.mypy]
python_version = "3.12"
files = ["src", "tests/helpers"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
