[project]
name = "dodeal-ai"
version = "0.1.0"
description = "Dodeal AI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "redis>=8.1.0",
    "httpx>=0.27.0",
    "arq>=0.25.0",
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dodeal_ai"]

[tool.pytest.ini_options]
  pythonpath = ["."]
  asyncio_mode = "auto"
  addopts = "--cov=src/dodeal_ai --cov-report=term-missing --cov-report=json -m \"not integration and not redis_real and not load\""
  markers = [
    "integration: starts a local ASGI-backed fake HTTP server; excluded from the default run (pytest -m integration to run it).",
    "redis_real: needs a REAL Redis server on the configured URL; excluded from the default run (pytest -m redis_real to run it). The hermetic lane is fakeredis[lua] -- see tests/unit/test_cost_lua.py. Carried by every test under tests/redis_real/.",
    "load: the whole app in process under concurrent bursts, on a REAL Redis (db 10 cost, db 11 operational, on the DODEAL_REDIS_REAL_URL server, flushed per test); excluded from the default run (pytest -m load --no-cov to run it). Carried by every test under tests/load/.",
    "eval: runs the whole vendored note corpus through the pipeline against FakeLLM. STRUCTURAL only -- it asserts every note yields a Judgement or a Suppressed state and never an exception, not that any judgement is good. Included in the default run: it is hermetic and fast, and a corpus note that crashes the pipeline should break CI. The real-model quality eval is tests/eval/test_quality_eval.py and is skipped unless DODEAL_EVAL_REAL=1.",
  ]

[tool.coverage.report]
fail_under = 92
exclude_also = [
    'class .*\bProtocol\):',
]
[tool.ruff]
# Pins the two values ruff was otherwise INFERRING: target-version from
# requires-python, and its default line-length. Both now survive a change to
# either default.
#
# Deliberately NO [tool.ruff.lint] select: the rule set in effect is ruff's
# built-in default, which is a curated ~413-rule set, not a set of prefix
# selectors (e.g. 2 of 19 pycodestyle-E rules, 1 of 46 pydocstyle, 3 of 60
# flake8-bandit). Writing select = ["E", "D", "S", ...] would turn on hundreds
# of rules that are off today, which is a separate decision from this pin.
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/helpers"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# The layer rule (register item 13), run as `uv run lint-imports` in CI. Core is
# the bottom layer and units sit under api and middleware; an import against the
# arrow fails the chain. Indirect imports count, so a detour does not pass.
[tool.importlinter]
root_package = "dodeal_ai"

[[tool.importlinter.contracts]]
name = "core imports nothing from units, api, middleware or tools"
type = "forbidden"
source_modules = ["dodeal_ai.core"]
forbidden_modules = [
    "dodeal_ai.units",
    "dodeal_ai.api",
    "dodeal_ai.middleware",
    "dodeal_ai.tools",
]

[[tool.importlinter.contracts]]
name = "units import nothing from api or middleware"
type = "forbidden"
source_modules = ["dodeal_ai.units"]
forbidden_modules = ["dodeal_ai.api", "dodeal_ai.middleware"]

[dependency-groups]
# The ONE dev list. `uv sync` installs from here; a second copy under
# [project.optional-dependencies] was never installed from and drifted.
dev = [
    "fakeredis[lua]>=2.38.0",
    # Starlette's TestClient prefers httpx2 over httpx. Remove only when
    # tools/httpx_transport.py migrates to httpx2 as well (planned: step 4,
    # with the transport rewrite).
    "httpx2>=2.9.1",
    "hypothesis>=6.100.0",
    "import-linter>=2.15",
    "mypy>=2.3.0",
    # The dependency auditor, locked like every other tool so CI and a hand run
    # use one advisory client. Always run against the EXPORTED lock, never the
    # venv: the editable project cannot be resolved and --strict makes it fatal.
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
