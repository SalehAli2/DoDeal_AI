services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DODEAL_REDIS_QUEUE_URL: redis://redis:6379/0
      DODEAL_REDIS_COST_URL: redis://redis:6379/1
      DODEAL_REDIS_OPERATIONAL_URL: redis://redis:6379/2
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped