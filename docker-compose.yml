# LOCAL ONLY: a laptop's stack. Production follows the DevOps sheet (its own
# Redis, persistence, restarts and grace periods), never this file.
# What the api and every call worker share: the image, the env files and the
# Redis URLs. An anchor, never `extends: api`, so no worker inherits the api's
# port: `ports: !reset []` under extends still published 8000 (Compose v5).
x-app: &app
  build: .
  # Optional, and it is the DEMO that made it optional: a clean checkout has
  # no .env, and `required: true` made `docker compose up` fail before the
  # service could tell anyone what was missing. Nothing is loosened by this --
  # Settings still refuses to start without DODEAL_JWT_SIGNING_KEY, so an
  # empty environment fails closed in the app, with a reason, as it always did.
  env_file:
    - path: .env
      required: false
  environment:
    DODEAL_REDIS_QUEUE_URL: redis://redis:6379/0
    DODEAL_REDIS_COST_URL: redis://redis:6379/1
    DODEAL_REDIS_OPERATIONAL_URL: redis://redis:6379/2
    DODEAL_REDIS_JOBS_URL: redis://redis:6379/3
  depends_on: [redis]

services:
  api:
    <<: *app
    ports: ["8000:8000"]
    # Time for in-flight requests to finish after SIGTERM before SIGKILL.
    stop_grace_period: 45s

  # The call workers (Unit B): the api's image, env files and Redis URLs and
  # no port, one container per queue so each gets its own SIGTERM and exit.
  # Until a speech-to-text adapter exists each refuses to start.
  worker-priority: &call-worker
    <<: *app
    command: ["python", "-m", "dodeal_ai.workers.calls", "priority"]
    # CALL_JOB_COMPLETION_WAIT_SECONDS (660) for running jobs, plus 30 s to
    # record them and close, before SIGKILL cuts a paid call short.
    stop_grace_period: 690s
    # The image's HEALTHCHECK probes the api's port, which a worker never opens.
    healthcheck:
      disable: true

  worker-normal:
    <<: *call-worker
    command: ["python", "-m", "dodeal_ai.workers.calls", "normal"]

  worker-overnight:
    <<: *call-worker
    command: ["python", "-m", "dodeal_ai.workers.calls", "overnight"]

  worker-stage2:
    <<: *call-worker
    command: ["python", "-m", "dodeal_ai.workers.calls", "stage2"]

  redis:
    image: redis:7-alpine
    # Every write kept on disk, so a restart loses no job, budget or hold.
    command: ["redis-server", "--appendonly", "yes"]
    # This machine only: an open Redis on the network holds every job record.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
