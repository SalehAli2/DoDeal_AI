name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # The layer rule (register item 13): the contracts are in pyproject.toml.
      - name: Import layers (import-linter)
        run: uv run lint-imports

      - name: Tests (with coverage gate)
        run: uv run pytest

      # Per-FILE floors for the deny-path modules. The gate above is an
      # average and can hide one security module rotting; this cannot.
      - name: Per-file coverage floors
        run: uv run python scripts/check_coverage_floors.py

      - name: Build wheel
        run: uv build --wheel

      - name: Wheel installs and imports outside the repo
        run: uv run python scripts/verify_wheel.py dist/*.whl

  # A SEPARATE job, beside `checks`, not an eighth step inside it. This result
  # is a function of the advisory database, not of the commit: a newly
  # published advisory must be free to go red without turning the chain red on
  # a hotfix that changed nothing.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # Audits the EXPORTED lock, never the venv (ruling R38).
      # --no-emit-project: the editable project is not on PyPI, can never be
      # resolved, and --strict counts that skip as a failure.
      # --strict: a third-party pin the auditor cannot check fails the job
      # instead of passing silently. No continue-on-error, no --ignore-vuln.
      - name: Dependency audit
        run: uv export --format requirements-txt --no-emit-project -o audit.txt && uv run pip-audit --strict --desc -r audit.txt

  # A SEPARATE job, beside `checks` and `audit` (register item 106): the one run
  # of the Lua scripts and SET NX/XX on a real server. REQUIRED turns the lane's
  # skips into failures, so a service that never came up cannot pass green.
  redis_real:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # db 9: the lane refuses db0 to db2, the service's own stores.
      - name: Real-Redis lane
        env:
          DODEAL_REDIS_REAL_URL: redis://localhost:6379/9
          DODEAL_REDIS_REAL_REQUIRED: "1"
        run: uv run pytest -m redis_real --no-cov -rs

      # Register item 74: the served app under bursts, on the same server. The
      # lane takes db 10 and db 11 from this URL and flushes only those two.
      - name: Load lane
        env:
          DODEAL_REDIS_REAL_URL: redis://localhost:6379/9
          DODEAL_REDIS_REAL_REQUIRED: "1"
        run: uv run pytest -m load --no-cov -rs
