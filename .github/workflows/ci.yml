name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (with coverage gate)
        run: uv run pytest

      # Per-FILE floors for the deny-path modules. The gate above is an
      # average and can hide one security module rotting; this cannot.
      - name: Per-file coverage floors
        run: uv run python scripts/check_coverage_floors.py

      - name: Build wheel
        run: uv build --wheel

      - name: Wheel installs and imports outside the repo
        run: uv run python scripts/verify_wheel.py dist/*.whl
